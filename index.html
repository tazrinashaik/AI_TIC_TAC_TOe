<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="AI Tic-Tac-Toe game using Minimax Algorithm">

    <title>AI Tic-Tac-Toe</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- HEADER -->
        <header>
            <h1>🤖 AI Tic-Tac-Toe</h1>

            <p class="subtitle">
                Human vs Artificial Intelligence
            </p>
        </header>


        <!-- PLAYER INFORMATION -->
        <section class="info">

            <div class="player-info">
                <span>Player</span>
                <strong>❌ X</strong>
            </div>

            <div class="player-info">
                <span>Computer</span>
                <strong>⭕ O</strong>
            </div>

        </section>


        <!-- SCOREBOARD -->
        <section class="scoreboard">

            <div class="score">
                <span>Player</span>
                <strong id="playerScore">0</strong>
            </div>

            <div class="score">
                <span>Draw</span>
                <strong id="drawScore">0</strong>
            </div>

            <div class="score">
                <span>AI</span>
                <strong id="aiScore">0</strong>
            </div>

        </section>


        <!-- GAME STATUS -->
        <div id="status">
            Your Turn ❌
        </div>


        <!-- GAME BOARD -->
        <section class="board" aria-label="Tic-Tac-Toe board">

            <button class="cell"
                data-index="0"
                aria-label="Cell 1">
            </button>

            <button class="cell"
                data-index="1"
                aria-label="Cell 2">
            </button>

            <button class="cell"
                data-index="2"
                aria-label="Cell 3">
            </button>

            <button class="cell"
                data-index="3"
                aria-label="Cell 4">
            </button>

            <button class="cell"
                data-index="4"
                aria-label="Cell 5">
            </button>

            <button class="cell"
                data-index="5"
                aria-label="Cell 6">
            </button>

            <button class="cell"
                data-index="6"
                aria-label="Cell 7">
            </button>

            <button class="cell"
                data-index="7"
                aria-label="Cell 8">
            </button>

            <button class="cell"
                data-index="8"
                aria-label="Cell 9">
            </button>

        </section>


        <!-- NEW GAME BUTTON -->
        <button id="newGame">
            🔄 New Game
        </button>


        <!-- ALGORITHM INFORMATION -->
        <section class="algorithm">

            <h2>🧠 AI Algorithm</h2>

            <p>
                This game uses the
                <strong>Minimax Algorithm</strong>
                to select the best possible move.
            </p>

            <p>
                The AI evaluates possible future moves
                and chooses the optimal move.
            </p>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
